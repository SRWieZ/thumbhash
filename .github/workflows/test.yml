name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}


    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [7.3, 7.4, 8.1, 8.2, 8.3, 8.4, 8.5]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Install Dependencies
        run: composer update -W --dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        if: matrix.php <= 8.1
        run: ./vendor/bin/pest --ci

      - name: Run tests
        if: matrix.php == 8.2
        run: ./vendor/bin/pest --ci --display-deprecations

      - name: Run tests
        if: matrix.php >= 8.3
        run: ./vendor/bin/pest --ci --fail-on-deprecation

